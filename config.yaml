title: 'Azure Table Extractor'
description: 'Extract tables from your documents using Azure Document Intelligence.'
instructions: ''
disclosures: |
  This Add-On sends data to a Microsoft Azure Document Intelligent endpoint which uses a form of machine learning to extract tables from documents. 
  Read the [privacy policy](https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/document-intelligence/data-privacy-security) to learn more.
type: object
documents:
  - selected
properties:
  start_page:
    title: Start page
    type: integer
    description: 'Page number where the table(s) begin'
    default: 1
  end_page:
    title: End page
    type: integer
    description: 'Page number where table(s) end'
    default: 1
  output_format:
    title: Output format
    type: string
    default: json
    enum:
      - csv
      - json
categories: 
  - extraction
  - premium
cost:
  price: 7
  amount: 1
  unit: page
version: 2
